name: Browser pilot

on:
  pull_request:
    paths:
      - 'experiments/browser-pilot/**'
      - '.github/workflows/browser-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: experiments/browser-pilot
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: bun install --ignore-scripts
      - run: bunx --package playwright@1.58.2 playwright install --with-deps chromium
      - run: bun test
      - run: bun run replay.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-pilot-results
          path: experiments/browser-pilot/results/
